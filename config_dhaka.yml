## Synthetic population pipeline for Dhaka
## based on the synpp package

# This is the path to a directory where the pipeline can store temporary data
working_directory: cache

# This section defines which parts of the pipeline should be run
run:
  - synthesis.output

  # MATSim-format demand-side files (population/facilities/households/vehicles).
  # These are pure Python, no Java/eqasim needed. The supply side (network,
  # transit schedule/vehicles) is pre-built externally via pt2matsim and lives
  # under raw_data/Dhaka/matsim/ - see dhaka/matsim/assemble_scenario.py, which
  # combines both sides into a runnable scenario + config.xml.
  - matsim.scenario.population
  - matsim.scenario.facilities
  - matsim.scenario.households
  - matsim.scenario.vehicles
  - dhaka.matsim.assemble_scenario

  # Not wired up (needs Java classes in eqasim-java that only exist for
  # Seville's mode set - see dhaka/matsim/assemble_scenario.py for the
  # eqasim-free alternative used instead):
  # - matsim.output

  # Validation/analysis figures (age, sex, household-size, activity chains,
  # mode/purpose distances) comparing synthetic output against HTS and
  # census - see analysis_dhaka/dhaka/ivt_style/. Mirrors how Seville wires
  # analysis.seville.ivt_style.* into config_seville.yml's own run: list.
  - analysis_dhaka.dhaka.ivt_style.compare_ipu
  - analysis_dhaka.dhaka.ivt_style.analysis
  - analysis_dhaka.dhaka.ivt_style.save_output


# Here the configuration of the pipeline starts
config:
  # Some general configuration
  processes: 8

  # Define whether to use ENTD or EGT as the household travel survey (HTS)
  hts: entd

  # Define sampling rate and random seed for the output population
  sampling_rate: 0.01
  random_seed: 1234

  # Paths to the input data and where the output should be stored (relative
  # to the repo root, since that's where we invoke `python -m synpp ...` from)
  data_path: raw_data/Dhaka
  output_path: output
  output_prefix: dhaka_1pct_

  # Where analysis_dhaka.dhaka.ivt_style.* stages write validation figures/CSVs
  analysis_path: output/analysis

  # Study area: DNCC + DSCC (full ward detail, current post-2020 numbering)
  # + Savar + Keraniganj (single zone each - the only two surrounding
  # upazilas with both real DTCA survey coverage and shapefile boundaries)
  dhaka.study_area_upazilas:
    - "Dhaka North City Corporation"
    - "Dhaka South City Corporation"
    - "Savar"
    - "Keraniganj"

  dhaka.ward_shp: spatial/ward_dhk_75.shp
  dhaka.ward_number_field: "Ward No."
  dhaka.ward_cc_field: CC
  dhaka.ward_upazila_field: ADM3_EN

  dhaka.hts: hts/dtca_full.xlsx
  dhaka.census: census/bangladesh_bbs_population-and-housing-census-dataset_2022_admin-02.xlsx
  # Ward-level age/sex marginals extracted from the BBS 2022 "Community Report:
  # Dhaka" PDF (Tables C-01/C-02, DNCC+DSCC only - see dhaka/ipu/prepare.py)
  dhaka.census_wards_c01: census/extracted/census_c01_wards.csv
  dhaka.census_wards_c02: census/extracted/census_c02_wards.csv
  dhaka.buildings_path: buildings/gis_osm_buildings_a_free_1.shp

  # Used by dhaka.data.osm.locations to supplement the sparsely-typed
  # buildings file with point-of-interest/amenity-polygon data (work/
  # education/shop/leisure candidates) - optional: falls back to
  # buildings-only with a warning if the file is absent
  dhaka.osm_path: osm/bangladesh-latest.osm.pbf

  home_location_sampling: weighted
  mode_choice: False
  matching_attributes: ["sex", "age_class", "has_license"]

  # IPU aggregation levels:
  # - commune_id (ward-level; not used by default here, see note below)
  # - departement_id (whole study area as a single zone)
  #
  # IPU still rakes at the departement_id (whole-study-area) level, not per
  # ward - the DTCA HTS seed sample isn't large enough per ward to rake
  # independently at commune_id granularity. But the control totals it rakes
  # against now come from real ward-level census marginals (summed across all
  # DNCC/DSCC wards) for the city-corp portion of the study area, with an
  # HTS-derived fallback for Savar/Keraniganj (no ward/union-level census
  # exists there) - see dhaka/ipu/prepare.py. Households are still assigned
  # to individual wards afterwards, drawn from the HTS's real ward
  # distribution (dhaka/ipu/attributed.py).
  IPU_aggregation_level: "departement_id"

  # Used by the generic synthesis.population.spatial.primary.education stage
  missing_trips_for_young_people: False

  eqasim_commit: f375a37
  eqasim_version: "2.0.0"
  eqasim_branch: "sutlab"

# Overrides for the Dhaka pipeline compared to the generic Île-de-France pipeline

aliases:
  synthesis.population.sampled: dhaka.ipu.attributed
  data.census.filtered: dhaka.ipu.attributed
  synthesis.population.income.selected: dhaka.income
  synthesis.population.spatial.home.zones: dhaka.homes
  synthesis.locations.home.locations: dhaka.locations.home
  synthesis.locations.education: dhaka.locations.education
  synthesis.locations.secondary: dhaka.locations.secondary
  synthesis.locations.work: dhaka.locations.work
  data.spatial.iris: dhaka.data.spatial.iris
  data.spatial.codes: dhaka.entd_codes

  data.hts.entd.raw: dhaka.data.hts.entd.raw
  data.hts.entd.filtered: dhaka.data.hts.entd.filtered
  data.hts.entd.cleaned: dhaka.data.hts.entd.cleaned
  data.hts.entd.reweighted: dhaka.data.hts.entd.reweighted

  synthesis.population.spatial.locations: dhaka.synthesis.population.spatial.locations
  synthesis.population.spatial.primary.distance_distributions: dhaka.synthesis.population.spatial.primary.distance_distributions
  synthesis.population.spatial.primary.work: dhaka.synthesis.population.spatial.primary.work
  synthesis.population.spatial.primary.education: dhaka.synthesis.population.spatial.primary.education
  synthesis.population.spatial.secondary.locations: dhaka.synthesis.population.spatial.secondary.locations

  synthesis.output: dhaka.output
  synthesis.population.trips: dhaka.synthesis.population.trips

  matsim.scenario.population: dhaka.matsim.scenario.population

  # Not aliased (fall through to the generic implementation - pure Python,
  # no per-city logic needed):
  # - synthesis.population.enriched: Seville's override only calibrates PT
  #   subscription/driving license against imputed HTS data; Dhaka's HTS
  #   already has real has_license per person and no PT-subscription data,
  #   so there's nothing to calibrate - the generic stage is used as-is.
  # - matsim.scenario.facilities / households / vehicles: fully generic

  # Not wired up (see `run:` above - needs Seville-only eqasim-java classes):
  # data.gtfs.cleaned: dhaka.data.gtfs.cleaned
  # matsim.simulation.prepare: dhaka.matsim.simulation.prepare
  # matsim.simulation.run: dhaka.matsim.simulation.run
  # matsim.scenario.prepare: matsim.simulation.prepare
